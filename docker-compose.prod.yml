# Parcelo on one server: Postgres, the API and the web app.
#   cp .env.example .env.prod   (then set the values below in it)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Required in .env.prod: POSTGRES_PASSWORD, JWT_SECRET (random, 32+ chars), PUBLIC_WEB_URL,
# PUBLIC_API_URL, and NOTIFY_CHANNEL (console, whatsapp or sms) with that provider's keys.
# Put a TLS proxy (Caddy, nginx, a cloud load balancer) in front of both ports.
name: parcelo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: parcelo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: parcelo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcelo -d parcelo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://parcelo:${POSTGRES_PASSWORD}@db:5432/parcelo?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGIN: ${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DOOR_DELIVERY_FEE_PAISE: ${DOOR_DELIVERY_FEE_PAISE:-2000}
      NOTIFY_CHANNEL: ${NOTIFY_CHANNEL:-console}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_LANGUAGE: ${WHATSAPP_LANGUAGE:-en}
      WHATSAPP_TEMPLATE_NEW_PARCEL: ${WHATSAPP_TEMPLATE_NEW_PARCEL:-}
      WHATSAPP_TEMPLATE_REMINDER: ${WHATSAPP_TEMPLATE_REMINDER:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_NEW_PARCEL: ${MSG91_TEMPLATE_NEW_PARCEL:-}
      MSG91_TEMPLATE_REMINDER: ${MSG91_TEMPLATE_REMINDER:-}
    volumes:
      - uploads:/app/apps/api/uploads
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
