# Set here, not in a location: nginx drops server-level add_header lines in any location with its own
map $uri $parcelo_cache {
  ~^/assets/  "public, max-age=31536000, immutable";

  default     "no-cache";
}

# The static intro page has small inline scripts of its own; the React app has none
map $uri $parcelo_script_src {
  ~^/welcome  "'self' 'unsafe-inline'";
  default     "'self'";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  # Keep the visitor's own scheme and port on /welcome -> /welcome/
  absolute_redirect off;

  # Behind a TLS proxy, plain HTTP goes to HTTPS
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  # Never serve hidden files, secrets, backups, dumps or source maps (and no SPA fallback for them)
  location ~ /\.(?!well-known/) { return 404; }
  location ~* \.(map|env|sql|bak|dump|old|orig|swp|log|ini|conf|pem|key|tar|gz|tgz|zip)$ { return 404; }

  # The static intro page and its kit (relative links, so keep the trailing slash)
  location = /welcome { return 301 /welcome/; }
  location /welcome/ { try_files $uri $uri/index.html =404; }

  # Hashed build files can be cached for a year
  location /assets/ { try_files $uri =404; }

  # Everything else is the React app (client-side routes)
  location / { try_files $uri /index.html; }

  add_header Cache-Control $parcelo_cache always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src $parcelo_script_src; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}
