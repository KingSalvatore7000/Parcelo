server {
  listen 80;
  root /usr/share/nginx/html;

  # The static intro page and its kit (relative links, so keep the trailing slash)
  location = /welcome { return 301 /welcome/; }
  location /welcome/ { try_files $uri $uri/index.html =404; }

  # Hashed build files can be cached for a year
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Everything else is the React app (client-side routes)
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
